<meta name="application-name" content="Rytíř Čísel">
<link rel="icon" href="ikony/ikona-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="ikony/ikona-180.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%A1%EF%B8%8F%3C/text%3E%3C/svg%3E">

  <script src="js/levels-act2.js"></script>

  <script src="js/main.js"></script>

  <script>
  /* Service worker: kvůli němu jde hra nainstalovat na plochu a funguje bez sítě.
     Z file:// se registrovat nedá, tam se prostě přeskočí a hra běží jako dřív. */
  if ('serviceWorker' in navigator && location.protocol.slice(0, 4) === 'http') {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
  </script>
</body>
